<!DOCTYPE html>
<html lang="en" data-lang-choice>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5th Grade Study Hub</title>
    <link rel="stylesheet" href="css/quiz.css?v=845828df">
</head>
<body>

<!-- Environment (GAMES-15) and holidays (GAMES-16), shared with every subject -->
<div id="env-scene" aria-hidden="true"></div>
<div id="holiday-scene" aria-hidden="true"></div>

<div class="main-wrapper">
    <div class="anime-container">
        <div class="avatar" id="anime-avatar">👧🏻</div>
        <div class="speech-bubble" id="tutor-dialogue">
            Hello! I'm <b>Anya-chan</b>. Write your name and choose a subject!
        </div>
    </div>

    <div class="game-container">
        <div id="holiday-garland" class="holiday-garland hidden" aria-hidden="true"></div>

        <!-- Main page (GAMES-18) -->
        <div id="menu-screen">
            <div class="hub-lang" role="group" aria-label="Language / Idioma">
                <span data-t="language">Language</span>
                <button type="button" class="small-btn" data-lang="en" aria-pressed="true">English</button>
                <button type="button" class="small-btn" data-lang="es" aria-pressed="false">Español</button>
            </div>
            <div class="menu-header">
                <h1 data-t="title">🌟 My Study Hub 🌟</h1>
                <p class="subtitle" data-t="subtitle">Choose what you want to study today.</p>
            </div>

            <div class="field-grid" style="margin-bottom: 20px;">
                <label><span data-t="name">Your name</span>
                    <input type="text" id="student-name" placeholder="Write your name" maxlength="40">
                </label>
            </div>

            <div class="env-panel">
                <div class="env-window"><div id="env-window"></div><div class="holiday-window" id="holiday-window"></div></div>
                <div class="env-info">
                    <p class="env-summary" id="env-summary"></p>
                    <label class="env-city"><span data-t="weatherOf">Weather of</span>
                        <select id="env-city"></select>
                    </label>
                    <p class="note env-note" id="env-note"></p>
                </div>
            </div>

            <h2 class="hub-title" data-t="subjectsTitle">📚 Subjects</h2>
            <div class="guide-cards subject-cards">
                <div class="guide-card subject-card">
                    <h2 data-t="englishTitle">🔤 English</h2>
                    <p class="note" data-t="englishNote"></p>
                    <div class="card-actions">
                        <a class="main-btn" href="Ingles.html" data-t="englishOpen">▶ Open English</a>
                    </div>
                </div>

                <div class="guide-card subject-card">
                    <h2 data-t="camposTitle">📚 Español · Campos formativos</h2>
                    <p class="note" data-t="camposNote"></p>
                    <div class="card-actions">
                        <a class="main-btn btn-secondary" href="campos/Guia5.html" data-t="camposOpen">▶ Open the guide</a>
                    </div>
                </div>

                <div class="guide-card subject-card soon" aria-disabled="true">
                    <h2 data-t="mathTitle">🔢 Math</h2>
                    <p class="note" data-t="mathNote"></p>
                    <div class="card-actions">
                        <span class="main-btn soon-btn" data-t="mathOpen">⏳ Coming soon</span>
                    </div>
                </div>
            </div>

            <div class="hub-summary" id="hub-summary" aria-live="polite"></div>

            <!-- Backup of the progress, to take it to another device (GAMES-19) -->
            <div class="hub-backup" id="hub-backup">
                <h2 data-t="backupTitle">💾 My backup</h2>
                <p class="note" data-t="backupNote"></p>
                <label class="chip"><input type="checkbox" id="backup-notebook" checked> <span data-t="backupNotebook">Include my notebook</span></label>
                <div class="card-actions">
                    <button type="button" class="main-btn" id="backup-download" data-t="backupDownload">💾 Download my backup</button>
                    <button type="button" class="main-btn btn-secondary" id="backup-copy" data-t="backupCopy">📋 Copy my code</button>
                </div>
                <textarea id="backup-code" class="backup-text hidden" rows="3" readonly aria-label="Backup code"></textarea>
                <h3 data-t="backupRestoreTitle">📥 Bring my progress to this device</h3>
                <label class="small-btn file-btn"><span data-t="backupFile">📂 Choose my backup file</span>
                    <input type="file" id="backup-file" accept=".json,application/json,text/plain">
                </label>
                <textarea id="backup-paste" class="backup-text" rows="3" data-tp="backupPaste" aria-label="Backup code"></textarea>
                <div class="card-actions">
                    <button type="button" class="main-btn" id="backup-restore" data-t="backupRestore">📥 Restore my progress</button>
                </div>
                <p class="status" id="backup-status" aria-live="polite"></p>
            </div>
        </div>
    </div>
</div>

<!-- Pets (GAMES-9): dressed with the prizes of the student (GAMES-14) -->
<div id="pets"></div>

<script src="js/lang.js?v=fdf2f8e8"></script>
<script src="js/api.js?v=4d6f82d0"></script>
<script src="js/pet-rewards.js?v=81696d14"></script>
<script src="js/progress.js?v=53bb764b"></script>
<script src="js/notebook-check.js?v=72cb7aee"></script>
<script src="js/backup.js?v=5538cda3"></script>
<script src="js/environment.js?v=2bee1461"></script>
<script src="js/holidays.js?v=3c630250"></script>
<script src="js/hub.js?v=e5eaff66"></script>
<script src="js/pets.js?v=fcbe1085"></script>
<script src="js/my-pets.js?v=cc2eae4f"></script>
<script src="js/student.js?v=1c7502b3"></script>
</body>
</html>
