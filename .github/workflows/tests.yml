# Quality gate (constitution Principle IV): runs the tests of every game on each
# push and pull request to main. No npm install: the project has no dependencies.
# The block is a process one (FR-037): a red check means the Jira story cannot be closed.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
